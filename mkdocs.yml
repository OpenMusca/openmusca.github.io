site_name: OpenMusca
site_description: Open-source local firmware for the PETKIT P592 pet feeder (experimental, work in progress). Unofficial, not affiliated with PETKIT.
site_url: https://openmusca.github.io/
repo_url: https://github.com/OpenMusca/musca
repo_name: OpenMusca/musca (source release coming soon)
copyright: Unofficial community project, not affiliated with or endorsed by PETKIT. Text and site content under the MIT licence (see the Licence page). Logo based on "Fly" by Delapouite (game-icons.net), CC BY 3.0, modified.
use_directory_urls: true
strict: true

theme:
  name: material
  font: false            # no external fonts, system font stack only
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  generator: false       # no "Made with Material" footer link
  # no analytics, no cookie consent, no social cards, no CDN

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.superfences

nav:
  - Home: index.md
  - News: news.md
  - Documentation:
      - Overview: overview.md
      - Quickstart: quickstart.md
      - Compatibility: compatibility.md
      - FAQ: faq.md
      - Hardware: hardware.md
      - Architecture: architecture.md
      - Install guide (M1): install.md
      - Uninstall: uninstall.md
      - Home Assistant: home-assistant.md
      - Apple Home, Google, Alexa: smart-home-bridges.md
      - Configuration: configuration.md
      - Web UI: web-ui.md
      - Radio (experimental): radio.md
      - Safety and recovery: safety-recovery.md
      - Troubleshooting: troubleshooting.md
      - Privacy: privacy.md
      - Development: development.md
      - Legal: legal.md
  - Project:
      - Security policy: security.md
      - Contributing: contributing.md
      - Licence: licensing.md
      - Disclaimer: disclaimer.md
